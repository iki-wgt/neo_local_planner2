# Merge into the existing Nav2 configuration; keep controller_plugins/MPPI settings.
# The plugin ID below matches the existing controller selector: NeoLocalPlanner.
/nav/controller_server:
  ros__parameters:
    controller_frequency: 50.0
    odom_topic: "/odom"
    enable_stamped_cmd_vel: true
    publish_zero_velocity: true
    NeoLocalPlanner:
      plugin: "neo_local_planner2::NeoLocalPlanner"
      local_frame: "odom"
      base_frame: "base_link"
      odom_topic: "/odom"
      local_plan_topic: "local_plan"
      acc_lim_x: 0.25
      acc_lim_y: 0.25
      acc_lim_theta: 0.8
      max_vel_x: 0.8
      min_vel_x: -0.2
      max_vel_y: 0.5
      min_vel_y: -0.5
      max_rot_vel: 0.8
      min_rot_vel: 0.1
      max_trans_vel: 0.8
      min_trans_vel: 0.1
      yaw_goal_tolerance: 0.005
      xy_goal_tolerance: 0.01
      goal_tune_time: 0.5
      lookahead_time: 0.4
      lookahead_dist: 1.0
      start_yaw_error: 0.5
      pos_x_gain: 1.0
      pos_y_gain: 1.0
      static_yaw_gain: 3.0
      cost_x_gain: 0.1
      cost_y_gain: 0.1
      cost_y_lookahead_dist: 0.0
      cost_y_lookahead_time: 0.3
      cost_yaw_gain: 2.0
      low_pass_gain: 0.2
      max_cost: 0.95
      max_curve_vel: 0.3
      max_goal_dist: 0.5
      max_backup_dist: 0.0
      min_stop_dist: 0.2
      differential_drive: false
      allow_reversing: false
      # Additional safety settings; the tuning above matches the supplied configuration.
      emergency_acc_lim_x: 0.5
      trans_stopped_vel: 0.05
      rot_stopped_vel: 0.05
      max_control_dt: 0.5
      clock_wait_timeout: 0.05
