# Merge into your controller_server parameters. TF frames are independent of /nav.
# Keep your robot's existing costmap, footprint, goal checker and progress checker.
/nav/controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: "/odom"
    enable_stamped_cmd_vel: true
    publish_zero_velocity: true
    failure_tolerance: 0.3
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "neo_local_planner2::NeoLocalPlanner"
      local_frame: "odom"          # Must match the local costmap global_frame.
      base_frame: "base_link"      # Must match the local costmap robot_base_frame.
      odom_topic: "/odom"          # Explicit topic, independent of TF frame IDs.
      local_plan_topic: "local_plan"
      differential_drive: false
      allow_reversing: false
      min_vel_x: -0.5
      max_vel_x: 0.5
      min_vel_y: -0.5
      max_vel_y: 0.5
      min_vel_trans: 0.0
      max_vel_trans: 0.5           # Limit on hypot(vx, vy), not each axis separately.
      min_rot_vel: 0.0
      max_rot_vel: 0.5
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      acc_lim_theta: 0.5
      emergency_acc_lim_x: 0.5
      trans_stopped_vel: 0.05
      rot_stopped_vel: 0.05
      max_control_dt: 0.5
      low_pass_gain: 0.5
      lookahead_time: 0.5
      lookahead_dist: 0.5
      max_cost: 0.9
      min_stop_dist: 0.5
